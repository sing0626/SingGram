name: Check Telegram Upstream

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Telegram upstream ref to check
        required: true
        default: master
      target_branch:
        description: SingGram branch to update and build
        required: true
        default: android-official-fork
      auto_commit_to_branch:
        description: Commit detected upstream version metadata to the target branch
        required: true
        type: boolean
        default: true
      dispatch_build:
        description: Also start the SingGram build workflow
        required: true
        type: boolean
        default: true
  schedule:
    - cron: "17 */6 * * *"

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: check-telegram-upstream-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      UPSTREAM_URL: https://github.com/DrKLO/Telegram.git
      UPSTREAM_REF: ${{ github.event.inputs.upstream_ref || 'master' }}
      TARGET_BRANCH: ${{ github.event.inputs.target_branch || 'android-official-fork' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.target_branch || 'android-official-fork' }}

      - name: Check upstream ref
        id: upstream
        shell: bash
        run: |
          set -euo pipefail

          imported_commit="$(jq -r '.importedCommit // ""' .github/singgram-upstream.json)"
          imported_version="$(jq -r '.importedVersion // ""' .github/singgram-upstream.json)"
          imported_version_code="$(jq -r '.importedVersionCode // ""' .github/singgram-upstream.json)"
          latest_line="$(git ls-remote "$UPSTREAM_URL" "refs/heads/$UPSTREAM_REF" | head -n 1)"

          if [[ -z "$latest_line" ]]; then
            echo "Cannot find upstream ref: $UPSTREAM_REF" >&2
            exit 1
          fi

          latest_commit="$(awk '{print $1}' <<< "$latest_line")"
          latest_short="${latest_commit:0:8}"

          tmpdir="$(mktemp -d)"
          git -c protocol.version=2 clone --depth 1 --filter=blob:none --no-checkout "$UPSTREAM_URL" "$tmpdir/upstream"
          git -C "$tmpdir/upstream" fetch --depth 1 origin "$latest_commit"
          git -C "$tmpdir/upstream" checkout --detach "$latest_commit"

          upstream_props=""
          for candidate in gradle.properties TMessagesProj/gradle.properties; do
            if [[ -f "$tmpdir/upstream/$candidate" ]]; then
              upstream_props="$tmpdir/upstream/$candidate"
              break
            fi
          done

          if [[ -z "$upstream_props" ]]; then
            echo "Cannot find upstream gradle.properties at $latest_short" >&2
            exit 1
          fi

          latest_version="$(sed -n 's/^APP_VERSION_NAME=//p' "$upstream_props" | head -n 1)"
          latest_version_code="$(sed -n 's/^APP_VERSION_CODE=//p' "$upstream_props" | head -n 1)"
          if [[ -z "$latest_version" || -z "$latest_version_code" ]]; then
            echo "Cannot parse upstream app version from $upstream_props" >&2
            exit 1
          fi

          {
            echo "imported_commit=$imported_commit"
            echo "imported_version=$imported_version"
            echo "imported_version_code=$imported_version_code"
            echo "latest_commit=$latest_commit"
            echo "latest_short=$latest_short"
            echo "latest_version=$latest_version"
            echo "latest_version_code=$latest_version_code"
          } >> "$GITHUB_OUTPUT"

          if [[ ("$latest_commit" == "$imported_commit"* || "$imported_commit" == "$latest_short") && "$latest_version" == "$imported_version" && "$latest_version_code" == "$imported_version_code" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit upstream version metadata
        if: ${{ steps.upstream.outputs.changed == 'true' && (github.event_name == 'schedule' || inputs.auto_commit_to_branch) }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMPORTED_COMMIT: ${{ steps.upstream.outputs.imported_commit }}
          IMPORTED_VERSION: ${{ steps.upstream.outputs.imported_version }}
          LATEST_COMMIT: ${{ steps.upstream.outputs.latest_commit }}
          LATEST_SHORT: ${{ steps.upstream.outputs.latest_short }}
          LATEST_VERSION: ${{ steps.upstream.outputs.latest_version }}
          LATEST_VERSION_CODE: ${{ steps.upstream.outputs.latest_version_code }}
        run: |
          set -euo pipefail

          git fetch origin "$TARGET_BRANCH"
          git switch "$TARGET_BRANCH" || git switch -c "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          git pull --ff-only origin "$TARGET_BRANCH"

          jq \
            --arg upstream "$UPSTREAM_URL" \
            --arg ref "$UPSTREAM_REF" \
            --arg commit "$LATEST_COMMIT" \
            --arg version "$LATEST_VERSION" \
            --arg versionCode "$LATEST_VERSION_CODE" \
            '.upstream = $upstream
             | .ref = $ref
             | .importedCommit = $commit
             | .importedVersion = $version
             | .importedVersionCode = $versionCode
             | .lastCheckedAt = now
             | .lastCheckedCommit = $commit' \
            .github/singgram-upstream.json > /tmp/singgram-upstream.json
          mv /tmp/singgram-upstream.json .github/singgram-upstream.json

          perl -0pi -e "s/APP_VERSION_NAME=.*/APP_VERSION_NAME=$LATEST_VERSION/" official-android/gradle.properties

          if git diff --quiet -- .github/singgram-upstream.json official-android/gradle.properties; then
            echo "No metadata changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/singgram-upstream.json official-android/gradle.properties
            git commit -m "Track Telegram Android $LATEST_VERSION"
            git push origin "HEAD:$TARGET_BRANCH"
          fi

      - name: Dispatch build workflow
        if: ${{ steps.upstream.outputs.changed == 'true' && (github.event_name == 'schedule' || inputs.dispatch_build) }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST_COMMIT: ${{ steps.upstream.outputs.latest_commit }}
          LATEST_SHORT: ${{ steps.upstream.outputs.latest_short }}
          LATEST_VERSION: ${{ steps.upstream.outputs.latest_version }}
          LATEST_VERSION_CODE: ${{ steps.upstream.outputs.latest_version_code }}
        run: |
          set -euo pipefail

          gh workflow run official-android-build.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$TARGET_BRANCH" \
            -f gradle_task=':TMessagesProj_App:assembleArm64Release' \
            -f upload_name='SingGram-arm64-release' \
            -f publish_release=true \
            -f auto_bump_version=true \
            -f prerelease=false \
            -f release_notes="SingGram rebuild triggered by Telegram Android upstream check.\n\n- Telegram Android: $LATEST_VERSION ($LATEST_VERSION_CODE)\n- Upstream commit: $LATEST_COMMIT\n- Branch: $TARGET_BRANCH"
