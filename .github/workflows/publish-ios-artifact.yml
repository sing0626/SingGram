name: Publish existing iOS build as prerelease

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Build SingGram iOS run ID
        required: true
        default: "42146562563"
  push:
    branches:
      - fix/ios-prerelease-publishing
    paths:
      - .github/workflows/publish-ios-artifact.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-ios-artifact-${{ inputs.run_id || '42146562563' }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ inputs.run_id || '42146562563' }}
    steps:
      - name: Checkout publication script
        uses: actions/checkout@v7

      - name: Verify successful source build
        id: source
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > "$RUNNER_TEMP/ios-source-run.json"
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          run = json.loads((Path(os.environ['RUNNER_TEMP']) / 'ios-source-run.json').read_text())
          assert run['id'] == int(os.environ['SOURCE_RUN_ID']), 'Unexpected run ID'
          assert run['repository']['full_name'] == os.environ['GITHUB_REPOSITORY'], 'Unexpected repository'
          assert run['path'] == '.github/workflows/official-ios-build.yml', 'Not an iOS build workflow'
          assert run['status'] == 'completed' and run['conclusion'] == 'success', 'Source build did not succeed'
          assert re.fullmatch(r'[0-9a-f]{40}', run['head_sha']), 'Invalid source SHA'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"sha={run['head_sha']}\nnumber={run['run_number']}\nattempt={run['run_attempt']}\nurl={run['html_url']}\n")
              out.write(f"artifact=SingGram-ios-{run['run_number']}-{run['run_attempt']}\n")
          PY

      - name: Download existing build artifact
        env:
          ARTIFACT_NAME: ${{ steps.source.outputs.artifact }}
        run: |
          set -euo pipefail
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" --dir "$RUNNER_TEMP/ios-prerelease"
          test -s "$RUNNER_TEMP/ios-prerelease/SingGram-unsigned.ipa"

      - name: Publish IPA as prerelease
        env:
          IOS_BUILD_SHA: ${{ steps.source.outputs.sha }}
          IOS_BUILD_NUMBER: ${{ steps.source.outputs.number }}
          IOS_BUILD_ATTEMPT: ${{ steps.source.outputs.attempt }}
          IOS_BUILD_URL: ${{ steps.source.outputs.url }}
        run: bash scripts/publish_ios_prerelease.sh "$RUNNER_TEMP/ios-prerelease/SingGram-unsigned.ipa"
