name: Build SingGram iOS

# Build source fixes as well as signing and build configuration changes.
on:
  workflow_dispatch:
  push:
    branches:
      - telegram-ios
    paths:
      - .github/workflows/official-ios-build.yml
      - official-ios/**
      - scripts/fetch_official_ios_submodules.sh
      - scripts/write_singgram_ios_configuration.sh

permissions:
  contents: write

concurrency:
  group: singgram-ios-ipa
  cancel-in-progress: false

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 360

    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      # Fake profiles are issued for this id and team C67CF9S4VU.
      # Re-sign the downloaded IPA with your own certificate and leave this id.
      SINGGRAM_IOS_BUNDLE_ID: com.sing.singgram
      SINGGRAM_IOS_TEAM_ID: C67CF9S4VU
      SINGGRAM_IOS_APPSTORE_BUILD: "true"
      SINGGRAM_IOS_ENABLE_SIRI: "true"
      SINGGRAM_IOS_ENABLE_ICLOUD: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        working-directory: official-ios
        run: |
          set -euo pipefail
          XCODE_VERSION="$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')"
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version
          df -h

      - name: Check launch helpers
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined \
            official-ios/submodules/BuildConfigExtra/Tests/SignatureDataTests.c \
            -o "$RUNNER_TEMP/signature-data-tests"
          "$RUNNER_TEMP/signature-data-tests"
          swiftc official-ios/submodules/TelegramUI/Sources/SingGram/SingGramLaunchConfiguration.swift \
            official-ios/submodules/TelegramUI/Tests/LaunchConfiguration/main.swift \
            -o "$RUNNER_TEMP/launch-configuration-tests"
          "$RUNNER_TEMP/launch-configuration-tests"

      - name: Fetch iOS submodules
        run: scripts/fetch_official_ios_submodules.sh

      - name: Write SingGram build configuration
        run: scripts/write_singgram_ios_configuration.sh

      - name: Build arm64 IPA
        working-directory: official-ios
        run: |
          set -euo pipefail
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          BUILD_NUMBER_OFFSET="$(tr -d '[:space:]' < build_number_offset)"
          # Checkout is shallow; commit count would always be 1.
          BUILD_NUMBER="$((GITHUB_RUN_NUMBER + BUILD_NUMBER_OFFSET))"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="/private/var/tmp/_bazel_singgram" \
            build \
            --configurationPath="build-system/singgram-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER" \
            --outputBuildArtifactsPath="$GITHUB_WORKSPACE/ios-artifacts"
          mv "$GITHUB_WORKSPACE/ios-artifacts/Telegram.ipa" "$GITHUB_WORKSPACE/ios-artifacts/SingGram-unsigned.ipa"

      - name: Save IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: SingGram-ios-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ios-artifacts/SingGram-unsigned.ipa
            ios-artifacts/Telegram.DSYMs.zip
          if-no-files-found: error

      - name: Publish IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="ios-${GITHUB_SHA::7}"
          IPA="$GITHUB_WORKSPACE/ios-artifacts/SingGram-unsigned.ipa"
          test -f "$IPA"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA" --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi
          gh release create "$TAG" "$IPA" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --latest=false \
            --title "SingGram iOS ${GITHUB_SHA::7}" \
            --notes "Unsigned IPA. Bundle id com.sing.singgram. Re-sign with your own certificate and leave the bundle id. Direct file: SingGram-unsigned.ipa"
          echo "Download: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/SingGram-unsigned.ipa"
