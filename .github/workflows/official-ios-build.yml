name: Build SingGram iOS

# A push builds only when this workflow or the fake provisioning profiles change.
# Rebuild with iCloud off. CKContainer.default() aborts a re-signed launch.
on:
  workflow_dispatch:
  push:
    branches:
      - telegram-ios
      - feature/ios-ui-refresh
    paths:
      - .github/workflows/official-ios-build.yml
      - official-ios/**
      - scripts/write_singgram_ios_configuration.sh
      - scripts/publish_ios_prerelease.sh

permissions:
  contents: write

concurrency:
  group: singgram-ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 360

    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      # Fake profiles are issued for this id and team C67CF9S4VU.
      # Re-sign the downloaded IPA with your own certificate and leave this id.
      SINGGRAM_IOS_BUNDLE_ID: com.sing.singgram
      SINGGRAM_IOS_TEAM_ID: C67CF9S4VU
      SINGGRAM_IOS_APPSTORE_BUILD: "true"
      SINGGRAM_IOS_ENABLE_SIRI: "true"
      # CKContainer.default() raises an Objective-C exception without a usable iCloud
      # container after re-signing, and the process is killed before the login screen.
      SINGGRAM_IOS_ENABLE_ICLOUD: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        working-directory: official-ios
        run: |
          set -euo pipefail
          XCODE_VERSION="$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')"
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version
          df -h

      - name: Verify appearance preferences
        run: |
          set -euo pipefail
          for source in \
            official-ios/submodules/ChatListUI/Sources/Node/ChatListItem.swift \
            official-ios/submodules/TabBarUI/Sources/TabBarContollerNode.swift \
            official-ios/submodules/TelegramUI/Components/TabBarComponent/Sources/TabBarComponent.swift \
            official-ios/submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/SingGramSettingsController.swift \
            official-ios/submodules/TelegramUI/Components/Chat/ChatTextInputPanelNode/Sources/ChatTextInputPanelNode.swift \
            official-ios/submodules/TelegramUI/Components/GlassBackgroundComponent/Sources/GlassBackgroundComponent.swift \
            official-ios/submodules/TelegramUI/Components/GlassBackgroundComponent/Sources/SingGramSwiftUIGlass.swift
          do
            swiftc -frontend -parse "$source"
          done
          swiftc -warnings-as-errors \
            official-ios/submodules/SingGramAppearance/Sources/SingGramAppearance.swift \
            official-ios/submodules/SingGramAppearance/Tests/main.swift \
            -o "$RUNNER_TEMP/appearance-preferences-tests"
          "$RUNNER_TEMP/appearance-preferences-tests"

      - name: Fetch iOS submodules
        run: scripts/fetch_official_ios_submodules.sh

      - name: Write SingGram build configuration
        run: scripts/write_singgram_ios_configuration.sh

      - name: Build arm64 IPA
        working-directory: official-ios
        run: |
          set -euo pipefail
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          BUILD_NUMBER_OFFSET="$(tr -d '[:space:]' < build_number_offset)"
          # A shallow checkout reports one commit, so every previous IPA stayed at build 3732.
          BUILD_NUMBER="$((GITHUB_RUN_NUMBER + BUILD_NUMBER_OFFSET))"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="/private/var/tmp/_bazel_singgram" \
            build \
            --configurationPath="build-system/singgram-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER" \
            --outputBuildArtifactsPath="$GITHUB_WORKSPACE/ios-artifacts"
          mv "$GITHUB_WORKSPACE/ios-artifacts/Telegram.ipa" "$GITHUB_WORKSPACE/ios-artifacts/SingGram-unsigned.ipa"

      - name: Save IPA and matching debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: SingGram-ios-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ios-artifacts/SingGram-unsigned.ipa
            ios-artifacts/Telegram.DSYMs.zip
          if-no-files-found: error

      - name: Publish IPA as prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish_ios_prerelease.sh ios-artifacts/SingGram-unsigned.ipa
